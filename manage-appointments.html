<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Appointments | UpdateSys Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="manage-appointments">

<div class="sidebar-layout">
    <aside class="sidebar">
        <a class="brand admin-brand" href="admin-dashboard.html">
            <img class="logo" src="images/logo.jpg" alt="Update Salon Logo">
            <span>UpdateSys Admin <small>Salon Management Portal</small></span>
        </a>

        <nav class="side-menu">
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="manage-appointments.html">Manage Appointments</a>
            <a href="records-management.html">Records Management</a>
            <a href="admin-credentials.html">Admin Credentials</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </aside>

    <main class="admin-main">
        <div class="admin-top compact-admin-top">
            <div>
                <h1>Manage Appointments</h1>
            </div>
        </div>

        <section class="card admin-section appointment-management-card">
            <div class="tools-bar">
                <input type="text" id="adminSearch" placeholder="Search by customer or staff">
                <select id="adminStatusFilter">
                    <option value="All">All Status</option>
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                    <option value="Cancelled">Cancelled</option>
                    <option value="Completed">Completed</option>
                    <option value="Archived">Archived</option>
                </select>
                <button class="btn btn-primary" onclick="renderAdminAppointments()">Apply</button>
                <button class="btn btn-light" onclick="clearAdminFilters()">Clear</button>
            </div>

            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>Customer</th>
                            <th>Contact</th>
                            <th>Service</th>
                            <th>Staff</th>
                            <th>Date & Time</th>
                            <th>Payment</th>
                            <th>Proof/Reference</th>
                            <th>Status</th>
                            <th>Admin Action</th>
                        </tr>
                    </thead>
                    <tbody id="adminAppointmentsTable"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<div id="proofModal" class="modal-overlay" hidden onclick="closeProofModal(event)">
    <div class="modal-content proof-modal" role="dialog" aria-modal="true" aria-labelledby="proofModalTitle">
        <div class="modal-header">
            <div>
                <h2 id="proofModalTitle">Proof of Payment</h2>
                <p id="proofModalCaption" class="muted"></p>
            </div>
            <button type="button" class="modal-close" aria-label="Close proof preview" onclick="closeProofModal()">×</button>
        </div>
        <img id="proofModalImage" class="proof-modal-image" src="" alt="Proof of payment preview">
    </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
