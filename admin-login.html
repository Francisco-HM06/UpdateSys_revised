<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | UpdateSys</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-login">

<section class="login-page">
    <div class="login-card card">
        <img class="login-logo" src="images/logo.jpg" alt="Update Salon Logo">
        <h1>UpdateSys Admin</h1>
        <p>Salon Management Portal</p>

        <form id="adminLoginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="adminUsername" required placeholder="username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="adminPassword" required placeholder="password">
            </div>

            <button class="btn btn-primary full-btn" type="submit">Login</button>
            <a class="btn btn-light full-btn login-home-btn" href="index.html">Return to Home Page</a>
        </form>
    </div>
</section>

<script src="js/app.js"></script>
</body>
</html>
