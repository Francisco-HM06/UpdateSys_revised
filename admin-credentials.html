<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Credentials | UpdateSys Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="admin-credentials">

<div class="sidebar-layout">

<aside class="sidebar">
    <a class="brand admin-brand" href="admin-dashboard.html">
        <img class="logo" src="images/logo.jpg" alt="Update Salon Logo">
        <span>UpdateSys Admin <small>Salon Management Portal</small></span>
    </a>

    <nav class="side-menu">
        <a href="admin-dashboard.html">Dashboard</a>
        <a href="manage-appointments.html">Manage Appointments</a>
        <a href="records-management.html">Records Management</a>
        <a href="admin-credentials.html">Admin Credentials</a>
        <a href="#" onclick="logout()">Logout</a>
    </nav>
</aside>

    <main class="admin-main">
        <div class="admin-top">
            <div>
                <h1>Admin Credentials</h1>
            </div>
        </div>

        <section class="card admin-section credentials-section">
            <div class="section-title left no-margin">
                <h2>Change Admin Credentials</h2>
            </div>

            <form id="adminCredentialsForm" class="credentials-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="currentAdminPassword">Current Password</label>
                        <input type="password" id="currentAdminPassword" required placeholder="Enter current password">
                    </div>
                    <div class="form-group">
                        <label for="newAdminUsername">New Username</label>
                        <input type="text" id="newAdminUsername" required placeholder="Enter new username">
                    </div>
                    <div class="form-group">
                        <label for="newAdminPassword">New Password</label>
                        <input type="password" id="newAdminPassword" required minlength="6" placeholder="At least 6 characters">
                    </div>
                    <div class="form-group">
                        <label for="confirmAdminPassword">Confirm New Password</label>
                        <input type="password" id="confirmAdminPassword" required minlength="6" placeholder="Re-enter new password">
                    </div>
                </div>

                <div class="form-actions">
                    <p id="credentialsMessage" class="credentials-message muted"></p>
                    <button type="submit" class="btn btn-primary">Save Credentials</button>
                </div>
            </form>
        </section>
    </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
